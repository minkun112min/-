name: 마트 페이지 내려받기 (구조 확인용)

# 마트 홈페이지 모양을 확인하려고 원본 HTML을 debug/pages 에 저장합니다.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/snapshot-pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 페이지 내려받기
        run: |
          mkdir -p debug/pages
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148"
          python3 - <<'EOF' > debug/pages/urls.txt
          import json
          for m in json.load(open("config/marts.json"))["marts"]:
              if m.get("url"): print(m["id"], m["url"])
          EOF
          : > debug/pages/result.txt
          while read -r id url; do
            curl -sSL -A "$UA" --max-time 40 -o "debug/pages/$id.html" \
              -w "$id http=%{http_code} size=%{size_download} type=%{content_type} final=%{url_effective}\n" \
              "$url" >> debug/pages/result.txt 2>> debug/pages/result.txt || echo "$id 실패" >> debug/pages/result.txt
          done < debug/pages/urls.txt
          # 홈마트처럼 메인에 '행사보기' 링크만 있는 경우 그 페이지도 받기
          VIEW=$(grep -oE '/smart/view/[A-Za-z0-9]+\?home=[A-Za-z0-9]+' debug/pages/dhn.html | head -1)
          if [ -n "$VIEW" ]; then
            curl -sSL -A "$UA" --max-time 40 -o debug/pages/dhn_view.html \
              -w "dhn_view http=%{http_code} size=%{size_download} final=%{url_effective}\n" \
              "http://smart.dhn.kr$VIEW" >> debug/pages/result.txt 2>&1 || true
          fi
          cat debug/pages/result.txt
      - name: 저장
        run: |
          git config user.name "minsikdang-bot"
          git config user.email "actions@users.noreply.github.com"
          git add debug/pages
          git commit -m "마트 페이지 원본 저장 (구조 확인용)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
