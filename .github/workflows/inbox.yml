name: 아이패드가 보낸 마트 페이지 정리

# 아이패드가 inbox/ 에 페이지를 올리면 바로 특가로 바꿔 저장합니다.
on:
  push:
    branches: [main]
    paths: ["inbox/**", ".github/workflows/inbox.yml", "scripts/**"]
  workflow_dispatch: {}

concurrency:
  group: sales-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: 처리하고 저장 (겹치면 다시 처리)
        run: bash scripts/save_and_push.sh "아이패드가 보낸 특가 반영 $(TZ=Asia/Seoul date '+%F %H:%M')" python scripts/process_inbox.py
