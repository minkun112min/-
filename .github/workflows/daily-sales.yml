name: 매일 아침 마트 특가 수집

on:
  schedule:
    # 매일 한국시간 오전 7시 7분 (UTC 22:07)
    - cron: "7 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/fetch_sales.py
      - name: 바뀐 특가 저장
        run: |
          if git diff --quiet data/sales.json; then
            echo "변경 없음"
          else
            git config user.name "minsikdang-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/sales.json
            git commit -m "오늘의 특가 업데이트 $(TZ=Asia/Seoul date +%F)"
            git push
          fi
