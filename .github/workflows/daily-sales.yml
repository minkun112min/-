name: 매일 아침 마트 특가 수집

on:
  schedule:
    # 매일 한국시간 오전 7시 7분 (UTC 22:07)
    - cron: "7 22 * * *"
  workflow_dispatch: {}

concurrency:
  group: sales-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: 수집하고 저장 (겹치면 다시 수집)
        run: bash scripts/save_and_push.sh "오늘의 특가 업데이트 $(TZ=Asia/Seoul date +%F)" python scripts/fetch_sales.py
