		.glass{
			position: relative;
			overflow: hidden;
			padding: 1px 1px;
			border-radius: 16px;
			background: rgba(255,255,255,0.08);
			backdrop-filter: blur(8px);
			border: 1px solid rgba(255,255,255,0.2);
			color: #fff;
		}

		/* 수평 이동 + 대각선 반사 띠(폭 넓게) */
		.glass::after{
			content: "";
			position: absolute;
			top: 0;
			left: -60%;
			width: 240%;
			height: 100%;
			pointer-events: none;

			background:
			  linear-gradient(
				var(--angle),
				transparent 38%,
				rgba(255,255,255,0.18) 43%,
				rgba(255,255,255,var(--glow)) 50%,
				rgba(255,255,255,0.18) 57%,
				transparent 62%
			  );

			transform: translateX(-32%); /* 수평 이동만 */
			filter: blur(2.5px);
			mix-blend-mode: screen;
			opacity: 0;

			/* 여기서 duration이 var(--cycle)=5s */
			animation: shine-horizontal var(--cycle) linear infinite;
		}

	
		@keyframes shine-horizontal{
			0%   { transform: translateX(-32%); opacity: 0; }
			20%  { transform: translateX(-32%); opacity: 0; }  /* 대기 */

			22%  { opacity: 1; }                                /* 페이드 인 */

			80%  { transform: translateX(32%);  opacity: 1; }   /* 3초 이동 완료 */

			82%  { opacity: 0; }                                /* 페이드 아웃 */
			100% { transform: translateX(32%);  opacity: 0; }   /* 대기 */
		}

		/* 접근성: 모션 최소화 */
		@media (prefers-reduced-motion: reduce){
			.glass::after{ animation: none; opacity: 0; }
		}

<script>

//$(document).ready(function(){
//$(document).snowfall({deviceorientation : true, round : true, minSize: 1, maxSize:8,  flakeCount : 250});
//});

	var infowindow = new kakao.maps.InfoWindow({
		zIndex: 1
	});

	var mapContainer = document.getElementById('map'),
	mapOption = {
		center: new kakao.maps.LatLng(37.566826, 126.9786567),
		level: 2
	};

       // alert(779);
 
	var map = new kakao.maps.Map(mapContainer, mapOption);

	var geocoder = new kakao.maps.services.Geocoder();
    var coords  = '';
	geocoder.addressSearch('경기 광주시 중앙로 95-29 (역동)', function(result, status) {

        // 정상적으로 검색이 완료됐으면
         if (status === kakao.maps.services.Status.OK) {
                coords = new kakao.maps.LatLng(result[0].y, result[0].x);
            // 결과값으로 받은 위치를 마커로 표시합니다
            var marker = new kakao.maps.Marker({
                map: map,
                position: coords
            });

            // 인포윈도우로 장소에 대한 설명을 표시합니다
            var infowindow = new kakao.maps.InfoWindow({
                content: '<div class="in-box">{광주식자재마트}</div>'
            });
            infowindow.open(map, marker);

            // 지도의 중심을 결과값으로 받은 위치로 이동시킵니다
            map.setCenter(coords);
        }
    });

    function toLatLng(c) {
        if (c instanceof kakao.maps.LatLng) return c;
        const lat = c.lat ?? c.y, lng = c.lng ?? c.x;
        return new kakao.maps.LatLng(lat, lng);
    }

    // tilesloaded 1회만 듣기
    function onceTilesLoaded(map, cb) {
        const handler = kakao.maps.event.addListener(map, 'tilesloaded', function () {
            kakao.maps.event.removeListener(map, 'tilesloaded', handler);
            cb();
        });
    }
    $(document).on('click', '.mapToggleBtn', function () {
        var $areas = $('.mapToggleArea');

        // 현재 두 영역 중 하나라도 보이면 -> 이번엔 모두 숨김
        var anyVisible = $areas.filter(':visible').length > 0;
        if (anyVisible) {
            $areas.stop(true, true).slideUp(120);
            return;
        }

        // 모두 보이기로: 각 엘리먼트가 의도한 display를 복원
        // (주소 블록: block, 지도 블록: flex)
        $areas.each(function () {
            var $el = $(this);
            // 인라인 style에 display:flex가 있었던 엘리먼트(=지도 래퍼)는 flex로 복원
            var styleAttr = ($el.attr('style') || '').replace(/\s/g, '').toLowerCase();
            var targetDisplay = styleAttr.includes('display:flex') ? 'flex' : 'block';

            // slideDown이 기본 block을 강제하므로, 완료 후 flex로 보정
            $el
                .stop(true, true)
                .hide()
                .slideDown(120, function () {
                    if (targetDisplay !== 'block') {
                        $el.css('display', targetDisplay);
                    }
                });
        });

        // 지도가 있다면 보인 뒤 레이아웃 재계산 & 센터 맞춤 (선택)
        // map, marker, coords 변수가 전역에 있다고 가정
        setTimeout(function () {
            if (typeof map !== 'undefined' && map && typeof map.relayout === 'function') {
                map.relayout();
                console.log( 'coords', coords );
                if (typeof coords !== 'undefined') map.setCenter(coords);
                if (typeof infowindow !== 'undefined' && infowindow && typeof marker !== 'undefined') {
                    infowindow.open(map, marker);
                    // 지도의 중심을 결과값으로 받은 위치로 이동시킵니다
                    map.setCenter(coords);            
                }
            }
        }, 150); // 애니메이션 완료 직후
    });
</script>

<script src="https://ssl.daumcdn.net/dmaps/map_js_init/postcode.v2.js"></script>
<script>
    //본 예제에서는 도로명 주소 표기 방식에 대한 법령에 따라, 내려오는 데이터를 조합하여 올바른 주소를 구성하는 방법을 설명합니다.
    function go_search_addr() {
        new daum.Postcode({
            oncomplete: function(data) {
                // 팝업에서 검색결과 항목을 클릭했을때 실행할 코드를 작성하는 부분.

                // 도로명 주소의 노출 규칙에 따라 주소를 조합한다.
                // 내려오는 변수가 값이 없는 경우엔 공백('')값을 가지므로, 이를 참고하여 분기 한다.
                var fullRoadAddr = data.roadAddress; // 도로명 주소 변수
                var extraRoadAddr = ''; // 도로명 조합형 주소 변수

                // 법정동명이 있을 경우 추가한다. (법정리는 제외)
                // 법정동의 경우 마지막 문자가 "동/로/가"로 끝난다.
                if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
                    extraRoadAddr += data.bname;
                }
                // 건물명이 있고, 공동주택일 경우 추가한다.
                if(data.buildingName !== '' && data.apartment === 'Y'){
                   extraRoadAddr += (extraRoadAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                }
                // 도로명, 지번 조합형 주소가 있을 경우, 괄호까지 추가한 최종 문자열을 만든다.
                if(extraRoadAddr !== ''){
                    extraRoadAddr = ' (' + extraRoadAddr + ')';
                }
                // 도로명, 지번 주소의 유무에 따라 해당 조합형 주소를 추가한다.
                if(fullRoadAddr !== ''){
                    fullRoadAddr += extraRoadAddr;
                }

                // 우편번호와 주소 정보를 해당 필드에 넣는다.
//              document.getElementById('sample4_postcode').value = data.zonecode; //5자리 새우편번호 사용
