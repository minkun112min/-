    <script>
      // 콘텐츠형 채널홈 배경색 prefetch — React 로딩 전 흰색 플래시 방지

      (function () {
        var match = location.pathname.match(/^\/(_[a-zA-Z0-9]+)\/?$/);
        if (!match) return;
        var encodedId = match[1];
        var promise = fetch('/rocket-web/web/profiles/' + encodedId + '/home', {credentials: 'include'}).then(
          function (res) {
            return res.json();
          }
        );

        window.__PROFILE_HOME_PREFETCH__ = {encodedId: encodedId, promise: promise};

        promise
          .then(function (data) {
            if (data.home_type !== 'content') return;
            var media = data.content_home && data.content_home.background_media;
            var color = '#788590';
            if (media) {
              if (media.media_type === 'image' || media.media_type === 'video') {
                var avg = media.image && media.image.avg;
                if (avg) color = avg.charAt(0) === '#' ? avg : '#' + avg;
              } else if (media.media_type === 'color' && media.color) {
                color = media.color.charAt(0) === '#' ? media.color : '#' + media.color;
              }
            }
            var root = document.getElementById('root');
            document.documentElement.style.backgroundColor = color;
            document.body.style.backgroundColor = color;
            if (root) root.style.backgroundColor = color;
          })
          .catch(function () {});
      })();
